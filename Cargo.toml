[package]
name = "pnggrep"
version = "0.2.0"
authors = ["Edmondo Giovannozzi <edmondo.giovannozzi@enea.it>"]
edition = "2018"
description = "Fast, zero-dependency CLI tool to search and inspect metadata in PNG and SVG figures"
license = "MIT"
readme = "README.md"
keywords = ["png", "svg", "metadata", "cli", "hpc"]
categories = ["command-line-utilities"]

[dependencies]
# Zero external crates: relies solely on std and system libz via FFI

[target.'cfg(windows)'.dependencies]
flate2 = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
